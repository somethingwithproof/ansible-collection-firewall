---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  vars:
    firewall_test_config_path: >-
      {{ "/etc/sysconfig/nftables.conf" if ansible_facts.os_family == "RedHat"
         else "/etc/nftables.conf" }}

  tasks:
    - name: Check nftables service is running
      ansible.builtin.service:
        name: nftables
        state: started
      check_mode: true
      register: nftables_service
      failed_when: nftables_service.changed

    - name: Check nftables config file exists
      ansible.builtin.stat:
        path: "{{ firewall_test_config_path }}"
      register: nftables_conf
      failed_when: not nftables_conf.stat.exists

    - name: Check nftables config file permissions
      ansible.builtin.stat:
        path: "{{ firewall_test_config_path }}"
      register: nftables_conf_perms
      failed_when: nftables_conf_perms.stat.mode != '0600'

    - name: Verify nftables ruleset is loaded
      ansible.builtin.command:
        cmd: nft list ruleset
      register: nftables_ruleset
      changed_when: false
      failed_when: "'table inet filter' not in nftables_ruleset.stdout"

    - name: Verify SSH port is allowed
      ansible.builtin.command:
        cmd: nft list ruleset
      register: nftables_ssh
      changed_when: false
      failed_when: "'dport 22' not in nftables_ssh.stdout"

    - name: Load the legacy entry point in the verifier process
      ansible.builtin.include_role:
        name: thomasvincent.firewall.policy

    - name: Verify the legacy policy role preserves public facts
      ansible.builtin.assert:
        that:
          - firewall_backend_resolved == 'nftables'
          - firewall_facts.backend == 'nftables'
          - firewall_facts.defaults.policy_v4 == 'drop'

    - name: Verify a differing legacy EL configuration cannot become a wrong rollback source
      when: ansible_facts.os_family == 'RedHat'
      block:
        - name: Create a distinct legacy configuration in the disposable container
          ansible.builtin.copy:
            dest: /etc/nftables.conf
            content: "# Legacy rules require explicit migration.\n"
            mode: '0600'

        - name: Require rejection before any candidate is promoted
          block:
            - name: Exercise the migration guard through the real role
              ansible.builtin.include_role:
                name: thomasvincent.firewall.nftables

            - name: Reject an accepted implicit migration
              ansible.builtin.fail:
                msg: The role accepted a different legacy rollback source.
          rescue:
            - name: Require the expected migration guard
              ansible.builtin.assert:
                that: "'different legacy /etc/nftables.conf' in ansible_failed_result.msg"
      always:
        - name: Remove the disposable legacy migration fixture
          ansible.builtin.file:
            path: /etc/nftables.conf
            state: absent

    - name: Snapshot configuration before rollback test
      ansible.builtin.stat:
        path: "{{ firewall_test_config_path }}"
      register: firewall_test_original

    - name: Create isolated failure-injection directory
      ansible.builtin.file:
        path: /tmp/firewall-molecule-failure
        state: directory
        mode: '0700'

    - name: Verify failed apply restores the validated previous configuration
      block:
        - name: Install one-shot nft apply failure fixture
          ansible.builtin.copy:
            dest: /tmp/firewall-molecule-failure/nft
            mode: '0700'
            content: |
              #!/bin/sh
              if [ "$1" = '-f' ] && [ ! -f /tmp/firewall-molecule-failure/failed ]; then
                touch /tmp/firewall-molecule-failure/failed
                exit 1
              fi
              exec /usr/sbin/nft "$@"

        - name: Exercise the role with a changed candidate and a failed apply
          block:
            - name: Apply changed rules through the real role
              ansible.builtin.include_role:
                name: thomasvincent.firewall.nftables
                apply:
                  environment:
                    PATH: /tmp/firewall-molecule-failure:/usr/sbin:/usr/bin:/sbin:/bin
              vars:
                firewall_rules:
                  - name: rollback-test
                    direction: inbound
                    dest_port: 42424
                    action: accept

            - name: Reject an unexpectedly successful failure fixture
              ansible.builtin.fail:
                msg: The one-shot apply failure did not trigger rollback.
          rescue:
            - name: Require the expected role failure after successful rollback
              ansible.builtin.assert:
                that:
                  - "'Restored the previous configuration.' in ansible_failed_result.msg"

        - name: Inspect restored configuration
          ansible.builtin.stat:
            path: "{{ firewall_test_config_path }}"
          register: firewall_test_restored

        - name: Inspect restored live ruleset
          ansible.builtin.command:
            cmd: nft list ruleset
          changed_when: false
          register: firewall_test_ruleset

        - name: Assert file and live rules were restored
          ansible.builtin.assert:
            that:
              - firewall_test_restored.stat.checksum == firewall_test_original.stat.checksum
              - "'42424' not in firewall_test_ruleset.stdout"
              - "'dport 22' in firewall_test_ruleset.stdout"
      always:
        - name: Remove one-shot failure fixture
          ansible.builtin.file:
            path: /tmp/firewall-molecule-failure
            state: absent
        - name: Remove failed staged candidate
          ansible.builtin.file:
            path: "{{ firewall_test_config_path }}.staged"
            state: absent

- name: Verify the direct backend gathers its required facts
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Clear facts inherited from earlier verifier plays
      ansible.builtin.meta: clear_facts

    - name: Apply the backend without play-level gathering or backups
      ansible.builtin.include_role:
        name: thomasvincent.firewall.nftables
      vars:
        nftables_backup: false

    - name: Require distribution discovery for the native service path
      ansible.builtin.assert:
        that: ansible_facts.os_family in ['Debian', 'RedHat']
