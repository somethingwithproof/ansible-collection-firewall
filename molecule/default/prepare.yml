---
- name: Prepare disposable firewall test containers
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Refresh package indexes in test containers
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.os_family == 'Debian'

    - name: Refresh Enterprise Linux package indexes
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.os_family == 'RedHat'
