---
name: SonarQube Cloud

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_sonar:
        description: Run Sonar analysis on the selected branch
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Sonar eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report analysis policy
        env:
          ENABLED: ${{ vars.ENABLE_SONAR }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          MANUAL: ${{ inputs.run_sonar }}
        run: |
          eligible=false
          if [[ "$ENABLED" == true ]]; then
            if [[ "$EVENT" == push && "$REF" == "refs/heads/$DEFAULT_BRANCH" ]] ||
               [[ "$EVENT" == workflow_dispatch && "$MANUAL" == true ]] ||
               [[ "$EVENT" == pull_request && "$HEAD_REPO" == "$REPOSITORY" &&
                  ( "$HEAD_BRANCH" == sonar/* || "$HEAD_BRANCH" == release/* ) ]]; then
              eligible=true
            fi
          fi
          printf 'Sonar eligible: %s\n' "$eligible" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$eligible" != true ]]; then
            printf 'Skipped by switch, branch, manual input, or fork policy.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  analyze:
    name: Sonar Quality Gate
    needs: scope
    if: >-
      vars.ENABLE_SONAR == 'true' &&
      ((github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
       (github.event_name == 'workflow_dispatch' && inputs.run_sonar) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'sonar/') || startsWith(github.head_ref, 'release/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate requested configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$PROJECT_KEY" ]]; then
            echo '::error::Requested analysis needs SONAR_TOKEN and SONAR_PROJECT_KEY.'
            exit 1
          fi
          if [[ ! "$PROJECT_KEY" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo '::error::SONAR_PROJECT_KEY must contain only letters, digits, underscore, dot, colon or dash.'
            exit 1
          fi
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
