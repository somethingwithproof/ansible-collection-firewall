---
- name: Gather facts needed for service paths and rollback timestamps
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', distribution, date_time]
  when: >-
    ansible_facts.os_family is not defined or
    (nftables_backup | bool and ansible_date_time is not defined)

- name: Ensure nftables package present
  ansible.builtin.package:
    name: nftables
    state: present

- name: Check if existing config exists
  ansible.builtin.stat:
    path: "{{ nftables_conf_path }}"
  register: nftables_config_stat

- name: Inspect the legacy Enterprise Linux configuration before migration
  ansible.builtin.stat:
    path: /etc/nftables.conf
  register: nftables_legacy_config
  when:
    - ansible_facts.os_family == 'RedHat'
    - nftables_conf_path == '/etc/sysconfig/nftables.conf'

- name: Require an explicit migration of differing legacy rules
  ansible.builtin.assert:
    that:
      - >-
        not nftables_legacy_config.stat.exists or
        (nftables_config_stat.stat.exists and
         nftables_legacy_config.stat.checksum == nftables_config_stat.stat.checksum)
    fail_msg: >-
      A different legacy /etc/nftables.conf exists. Back up both files and move
      the validated previous configuration to /etc/sysconfig/nftables.conf
      before rerunning, or pin
      nftables_conf_path and configure the native service to load that path.
      The role will not choose a different rollback source implicitly.
  when:
    - ansible_facts.os_family == 'RedHat'
    - nftables_conf_path == '/etc/sysconfig/nftables.conf'

- name: Render staged config
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ nftables_conf_path }}.staged"
    mode: '0600'
  changed_when: false

- name: Validate staged config
  ansible.builtin.command:
    cmd: "nft -c -f {{ nftables_conf_path }}.staged"
  changed_when: false

- name: Inspect validated staged config
  ansible.builtin.stat:
    path: "{{ nftables_conf_path }}.staged"
  register: nftables_staged_stat

- name: Apply nftables config atomically
  when:
    - not (firewall_validate_only | default(false))
    - >-
      not (nftables_config_stat.stat.exists | default(false)) or
      nftables_config_stat.stat.checksum != nftables_staged_stat.stat.checksum
  block:
    - name: Backup existing config if present
      ansible.builtin.copy:
        src: "{{ nftables_conf_path }}"
        dest: "{{ nftables_conf_path }}.backup-{{ ansible_date_time.epoch }}"
        remote_src: true
        mode: '0600'
      when:
        - nftables_backup | bool
        - nftables_config_stat.stat.exists | default(false)
    - name: Promote staged config
      ansible.builtin.copy:
        src: "{{ nftables_conf_path }}.staged"
        dest: "{{ nftables_conf_path }}"
        remote_src: true
        mode: '0600'
      notify: Restart nftables

    - name: Apply nftables ruleset
      ansible.builtin.command:
        cmd: "nft -f {{ nftables_conf_path }}"
      changed_when: true
      register: nftables_apply_result

  rescue:
    - name: Rollback to backup on failure
      ansible.builtin.copy:
        src: "{{ nftables_conf_path }}.backup-{{ ansible_date_time.epoch }}"
        dest: "{{ nftables_conf_path }}"
        remote_src: true
        mode: '0600'
      when:
        - nftables_backup | bool
        - nftables_config_stat.stat.exists | default(false)

    - name: Apply rollback config
      ansible.builtin.command:
        cmd: "nft -f {{ nftables_conf_path }}"
      changed_when: true
      when:
        - nftables_backup | bool
        - nftables_config_stat.stat.exists | default(false)

    - name: Fail with error message
      ansible.builtin.fail:
        msg: >-
          Failed to apply nftables config.
          {{ 'Restored the previous configuration.' if
             (nftables_backup | bool and nftables_config_stat.stat.exists | default(false))
             else 'No backup was available for rollback.' }}

- name: Clean up staged config
  ansible.builtin.file:
    path: "{{ nftables_conf_path }}.staged"
    state: absent
  changed_when: false

- name: Enable and start nftables service
  ansible.builtin.service:
    name: "{{ nftables_service_name }}"
    enabled: true
    state: started
